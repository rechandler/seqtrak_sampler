[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seqtrak-sampler"
version = "0.3.2"
description = "Companion app for the Yamaha SEQTRAK: record, trim and convert samples"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5", "python-rtmidi>=1.5"]

[project.scripts]
y3s2wav = "seqtrak_sampler.cli:main"

[project.gui-scripts]
seqtrak-sampler = "seqtrak_sampler.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
