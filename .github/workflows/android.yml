name: Android test app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish as a pre-release, e.g. 0.1 (leave empty to only build)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle --no-daemon testDebugUnitTest assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk SEQTRAK-USB-Test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SEQTRAK-USB-Test
          path: android/SEQTRAK-USB-Test.apk

  # From Actions → Android test app → Run workflow with a version filled in.
  # A pre-release, so the website's "latest" download links keep pointing at the
  # desktop app.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SEQTRAK-USB-Test
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test-${{ inputs.version }}
          name: Android USB test ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: SEQTRAK-USB-Test.apk
          fail_on_unmatched_files: true
          body: |
            A small Android app that checks whether a phone can read, play and record the SEQTRAK's pads over USB.

            1. On the phone, open this page and download **SEQTRAK-USB-Test.apk**. Allow your browser to install apps when Android asks.
            2. Close the SEQTRAK app. Connect the SEQTRAK with a USB data cable (USB-C to USB-C, or an OTG adapter) and switch it on.
            3. Open **SEQTRAK USB test**, allow audio recording, tap **Enable SysEx** if it asks, then tap a pad.
            4. Tap **Share report** and paste the report back.
