name: Build

on:
  push:
    paths-ignore: ["docs/**", "android/**", ".github/workflows/android.yml"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. v0.1.0 (leave empty to only build)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - run: pip install "PySide6>=6.5"
      - run: PYTHONPATH=src QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v

  app:
    needs: test
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp release version
        if: inputs.version != '' || startsWith(github.ref, 'refs/tags/v')
        shell: python
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          import os, pathlib, re
          version = os.environ["VERSION"].lstrip("v")
          path = pathlib.Path("src/seqtrak_sampler/__init__.py")
          path.write_text(re.sub(r'__version__ = ".*"', f'__version__ = "{version}"',
                                 path.read_text()))
          print("version", version)
      - run: pip install pyinstaller ".[gui]"
      - run: pyinstaller --noconfirm --windowed --name "SEQTRAK Sampler" packaging/launch.py
      - name: Allow audio input (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="dist/SEQTRAK Sampler.app"
          plutil -insert NSMicrophoneUsageDescription -string "SEQTRAK Sampler records audio from your SEQTRAK over USB." "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/SEQTRAK Sampler.app" "SEQTRAK-Sampler-macOS.zip"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist/SEQTRAK Sampler" -DestinationPath "SEQTRAK-Sampler-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SEQTRAK-Sampler-${{ runner.os }}
          path: SEQTRAK-Sampler-*.zip

  # Publishes a GitHub Release with both apps, either when a v* tag is pushed or
  # from Actions → Build → Run workflow with a version filled in.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Check version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: SEQTRAK Sampler ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: SEQTRAK-Sampler-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
